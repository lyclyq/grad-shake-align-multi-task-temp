model:
  name: roberta-base
task:
  name: glue/rte
  max_len: 128
train:
  epochs: 1
  batch_size: 32
  lr: 2e-5
  warmup_ratio: 0.1
  seed: 12
  weight_decay: 0.0
  max_grad_norm: 1.0
  eval:
    strategy: per_epoch
    every_steps: 50
    first_step: false
    max_batches: 0
io:
  root: /home/lyclyq/Optimization/grad-shake-align/runs/glue_rte_roberta
  overwrite: ask
log:
  csv: true
  swanlab:
    enabled: false
    project: ShakeAlign_LoRA
debug:
  enabled: false
  print_every_steps: 80
  max_blocks_to_print: 3
  dump_init: true
  dump_votes: true
  dump_gates: true
  dump_grad_norms: true
  dump_history: false
  assert_hi_zero_init: true
method:
  name: ours
  baseline_r:
    lora:
      r: 32
      alpha: 2.0
      dropout: 0.1
  baseline_R:
    lora:
      r: 128
      alpha: 16.0
      dropout: 0.1
  ours:
    lora:
      r: 32
      R: 128
      alpha: 16.0
      dropout: 0.1
    ema_H: 1
    votes: 8
    ablate:
      interp: false
    gate0_noise:
      tau: -10.0
      kappa: 10.0
    trigger_gate0:
      tau_N: 0.6
      tau_D: 0.0038053
    routing_delta: 0.02
    pulling:
      gamma_pull: 0.35
      k_pull: 8.0
    voting:
      samples_per_vote: 8
      allow_tail: true
      keep_single_votes: true
    history:
      enabled: false
      window_steps: 1
      weighting: exp
      exp_beta: 0.7
    compensation:
      enabled: true
      ridge_lambda: 1e-4
    compression:
      enabled: false
      every_steps: 0
      target_rank: null
      qr:
        enabled: true
      svd:
        enabled: true
hpo:
  lr_grid:
    min_lr: 1e-5
    max_lr: 7e-3
    baseline_points: 15
    neighbor_points: 9
    extend_factor: 1.6
    clamp_min_lr: 1e-6
    clamp_max_lr: 1e-2
  baseline_variants:
  - tag: baseline_r
  - tag: baseline_R
  budget:
    total_trials: 300
  ratio_sensitivity: 0.2
  ratio_grid: 0.5
  ratio_bayes: 0.3
  use_bayes: false
  bandit:
    fixed_warmup_ratio: 0.1
    refine_seeds:
    - 12
    - 24
    score:
      w_max: 0.5
      w_final: 0.4
      w_avg: 0.1
  grid:
    knobs:
    - routing_delta
    drop_if_weight_lt: 0.0
    baseline_search_epochs: 3
    sensitivity_epochs: 1
    grid_epochs: 3
    sens_samples_per_knob: 40
    sens_seed: 12
    rng_seed: 2026
    max_retries: 3
    max_m_float: 7
    max_m_choice: 0
    bayes_rng_seed: 20260211
    bayes_pool: 256
    bayes_gp_length: 0.6
    bayes_gp_var: 1.0
    bayes_gp_noise: 1e-3
    bayes_ei_xi: 0.01
    alpha_probe:
      enabled: true
      num_alpha: 2
      num_lr: 2
      seeds:
      - 12
      - 24
      epochs: 3
    knob_specs:
      routing_delta:
        kind: float
        lo: 0.005
        hi: 0.08
        step: 0.001
        top_quantile: 0.2
        padding_ratio: 0.15
        clamp_lo: 0.0
        clamp_hi: 1.0
_provenance:
  base_config_path: configs/base.yaml
  schedule_path: null
  cli_set_args:
  - io.root=/home/lyclyq/Optimization/grad-shake-align/runs/glue_rte_roberta
  - hpo.budget.total_trials=300
stage: hpo
